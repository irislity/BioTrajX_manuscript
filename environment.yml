# =============================================================================
# environment.yml
#
# Single conda environment for the manuscript Python side:
#   - reticulate-invoked TI methods (PAGA-DPT via scanpy, Palantir) used from
#     manuscript/scripts/real/run_ti_methods.R
#       In R:  reticulate::use_condaenv("biotrajx_ti")
#   - the figure-assembly scripts (manuscript/assembly/*.py): numpy,
#     matplotlib (via matplotlib-base), Pillow, cairosvg, pymupdf, svgutils,
#     lxml
#
# Setup:
#   conda env create -f environment.yml
#   conda activate biotrajx_ti
# =============================================================================
name: biotrajx_ti
